services:
  db:
    image: postgres:17-alpine
    container_name: brasq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brasq
      POSTGRES_PASSWORD: brasq
      POSTGRES_DB: brasq
    ports:
      - "5434:5432"
    volumes:
      - brasq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasq"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API in a container (production-style). Start with:
  #   docker compose --profile api up -d --build
  api:
    profiles: ["api"]
    build: .
    container_name: brasq-api
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://brasq:brasq@db:5432/brasq
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  brasq-pgdata:
