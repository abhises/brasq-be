# /etc/nginx/sites-available/brasq
# Upstreams brasq_web and brasq_api live in /etc/nginx/conf.d/brasq-{web,api}-upstream.conf and are
# rewritten by brasq-release on every deploy to point at the live blue/green slot.
# Certificates from certbot (renewed by certbot.timer):
#   brasq.com + www.brasq.com : /etc/letsencrypt/live/www.brasq.com
#   api.brasq.com             : /etc/letsencrypt/live/api.brasq.com

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name brasq.com www.brasq.com api.brasq.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.brasq.com;
    ssl_certificate /etc/letsencrypt/live/www.brasq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.brasq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://brasq.com$request_uri;
}

# Site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brasq.com;
    ssl_certificate /etc/letsencrypt/live/www.brasq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.brasq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20m;

    # Locally stored uploads are served by the API
    location /uploads/ {
        proxy_pass http://brasq_api;
        proxy_set_header Host $host;
        expires 30d;
    }

    location / {
        proxy_pass http://brasq_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Automation API (Claude, scripts): https://api.brasq.com/api/admin/...
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.brasq.com;
    ssl_certificate /etc/letsencrypt/live/api.brasq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.brasq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20m;

    location / {
        proxy_pass http://brasq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Internal entry point for the web containers (BACKEND_URL=http://127.0.0.1:4000), so the
# frontend always talks to whichever api slot is live.
server {
    listen 127.0.0.1:4000;
    client_max_body_size 20m;
    location / {
        proxy_pass http://brasq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }
}
